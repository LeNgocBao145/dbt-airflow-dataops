version: 2

models:
  - name: brnz_orders
    description: Staging model for sales order headers
    columns:
      - name: order_id
        description: Sales order identifier
        tests:
          - not_null
      - name: customer_id
        description: Foreign key reference to customer

  - name: brnz_order_details
    description: Staging model for sales order detail line items
    columns:
      - name: order_detail_id
        description: Sales order detail identifier
        tests:
          - not_null
      - name: order_id
        description: Foreign key reference to an order
        tests:
          - not_null
      - name: product_id
        description: Foreign key reference to a product
      - name: quantity
        description: Quantity ordered
      - name: unit_price
        description: Unit price
      - name: line_total
        description: Total amount for the line item

  - name: brnz_customers
    description: "Bronze layer customer data from AdventureWorks"
    columns:
      - name: CustomerID
        description: "Primary key for customer"
        tests:
          - unique
          - not_null

      - name: FirstName
        description: "Customer first name"

      - name: LastName
        description: "Customer last name"

      - name: EmailPromotion
        description: "Email promotion preference"

      - name: StoreID
        description: "Store identifier"

      - name: TerritoryID
        description: "Sales territory"

      - name: last_modified_date
        description: "Last modified timestamp"
        tests:
          - not_null

  - name: brnz_sales_orders
    description: Staging model combining sales order headers and details
    columns:
      - name: line_total
        tests:
          - positive_values

      - name: order_date
        tests:
          - no_future_dates

      - name: sales_order_id
        description: Primary key for sales orders
        tests:
          - not_null
      - name: order_detail_id
        description: Primary key for sales order details
        tests:
          - not_null
      - name: order_date
        description: Date when the order was placed
        tests:
          - not_null
      - name: due_date
        description: Date when the order is due
      - name: ship_date
        description: Date when the order was shipped
      - name: status
        description: Current status of the order
      - name: online_order_flag
        description: Flag indicating if the order was placed online
      - name: sales_order_number
        description: Unique sales order number
      - name: purchase_order_number
        description: Customer purchase order number
      - name: customer_id
        description: Foreign key reference to customer
        tests:
          - not_null
          - relationships:
              to: ref('brnz_customers')
              field: CustomerID
      - name: sales_person_id
        description: ID of the sales person
      - name: territory_id
        description: Sales territory ID
      - name: product_id
        description: Foreign key reference to product
      - name: order_qty
        description: Quantity ordered
      - name: unit_price
        description: Unit price of the product
      - name: unit_price_discount
        description: Discount amount
      - name: line_total
        description: Total amount for this line item
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sales_order_id
            - order_detail_id
