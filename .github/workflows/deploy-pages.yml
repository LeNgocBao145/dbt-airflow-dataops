name: Deploy Documentation & Lineage to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-sqlserver sqlglot

      - name: Build Lineage & Docs
        run: |
          mkdir -p pages/dbt-docs pages/lineage
          # 1. Chạy dbt compile/docs generate
          cd dbt
          dbt deps || true
          dbt docs generate --profiles-dir . || true
          cd ..

          # 2. Copy dbt docs nếu có vào pages/dbt-docs/
          if [ -f dbt/target/index.html ]; then
            cp dbt/target/index.html pages/dbt-docs/index.html
          fi

          # 3. Chạy script tạo interactive Column Lineage
          python scripts/generate_lineage.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
