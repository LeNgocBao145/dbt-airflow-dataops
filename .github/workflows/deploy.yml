name: Deploy to Environments

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - test
          - production

env:
  DBT_PROFILES_DIR: ./dbt

jobs:
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    environment: test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'YourStrong@Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies and ODBC Driver
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev curl gnupg
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 mssql-tools
          pip install dbt-sqlserver pyodbc

      - name: Setup Test Database and User
        env:
          TEST_USER: ${{ secrets.TEST_SQL_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        run: |
          CONTAINER_ID=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2019-latest)
          curl -L -o /tmp/AdventureWorks2014.bak https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2014.bak
          docker cp /tmp/AdventureWorks2014.bak $CONTAINER_ID:/tmp/AdventureWorks2014.bak
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "RESTORE DATABASE AdventureWorks2014 FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_log.ldf'"
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "RESTORE DATABASE AdventureWorks2014_Test FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014_Test.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_Test_log.ldf'"
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '$TEST_USER') CREATE LOGIN [$TEST_USER] WITH PASSWORD = '$TEST_PASSWORD'; USE AdventureWorks2014; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$TEST_USER') CREATE USER [$TEST_USER] FOR LOGIN [$TEST_USER]; ALTER ROLE db_owner ADD MEMBER [$TEST_USER]; USE AdventureWorks2014_Test; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$TEST_USER') CREATE USER [$TEST_USER] FOR LOGIN [$TEST_USER]; ALTER ROLE db_owner ADD MEMBER [$TEST_USER];"

      - name: Run deployment
        env:
          TEST_SQL_SERVER: ${{ secrets.TEST_SQL_SERVER }}
          TEST_SQL_USER: ${{ secrets.TEST_SQL_USER }}
          TEST_SQL_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh test test

      - name: Run smoke tests
        run: |
          python scripts/smoke_tests.py \
            --server "${{ secrets.TEST_SQL_SERVER }}" \
            --database AdventureWorks2014_Test \
            --user "${{ secrets.TEST_SQL_USER }}" \
            --password "${{ secrets.TEST_SQL_PASSWORD }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment
          path: |
            dbt/target/
            backups/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    needs: []

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'YourStrong@Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies and ODBC Driver
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev curl gnupg
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 mssql-tools
          pip install dbt-sqlserver pyodbc

      - name: Setup Production Database and User
        env:
          PROD_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          CONTAINER_ID=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2019-latest)
          curl -L -o /tmp/AdventureWorks2014.bak https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2014.bak
          docker cp /tmp/AdventureWorks2014.bak $CONTAINER_ID:/tmp/AdventureWorks2014.bak
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "RESTORE DATABASE AdventureWorks2014 FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_log.ldf'"
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "RESTORE DATABASE AdventureWorks2014_Prod FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014_Prod.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_Prod_log.ldf'"
          docker exec $CONTAINER_ID /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '$PROD_USER') CREATE LOGIN [$PROD_USER] WITH PASSWORD = '$PROD_PASSWORD'; USE AdventureWorks2014; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$PROD_USER') CREATE USER [$PROD_USER] FOR LOGIN [$PROD_USER]; ALTER ROLE db_owner ADD MEMBER [$PROD_USER]; USE AdventureWorks2014_Prod; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$PROD_USER') CREATE USER [$PROD_USER] FOR LOGIN [$PROD_USER]; ALTER ROLE db_owner ADD MEMBER [$PROD_USER];"

      - name: Run deployment
        env:
          PROD_SQL_SERVER: ${{ secrets.PROD_SQL_SERVER }}
          PROD_SQL_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh production prod

      - name: Run smoke tests
        run: |
          python scripts/smoke_tests.py \
            --server "${{ secrets.PROD_SQL_SERVER }}" \
            --database AdventureWorks2014_Prod \
            --user "${{ secrets.PROD_SQL_USER }}" \
            --password "${{ secrets.PROD_SQL_PASSWORD }}"

      - name: Notify team
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Deployment to production completed with status: $JOB_STATUS"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            COLOR="good"
            [ "$JOB_STATUS" != "success" ] && COLOR="danger"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"Production Deployment: $JOB_STATUS\",\"text\":\"Commit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL secret not set. Skipping Slack notification."
          fi
